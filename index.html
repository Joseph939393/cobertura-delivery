
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobertura de Delivery | Lima y Callao</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">


<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f3f5f8;
  color: #172033;
}

header {
  background: #142d4e;
  color: white;
  padding: 22px 18px;
  text-align: center;
}

header h1 { margin: 0 0 7px; font-size: 23px; }
header p { margin: 0; font-size: 13px; color: #d5e2f1; }

main {
  max-width: 1100px;
  margin: 20px auto;
  padding: 0 14px;
}

.panel {
  background: white;
  border-radius: 12px;
  padding: 17px;
  margin-bottom: 15px;
  box-shadow: 0 2px 9px #00000010;
}

h2 { font-size: 17px; margin: 0 0 12px; }

input, select, button {
  font-size: 14px;
  padding: 12px;
  border-radius: 7px;
}

input, select {
  border: 1px solid #cbd5e1;
  background: white;
}

.search-row {
  display: flex;
  gap: 8px;
}

.search-row input { flex: 1; min-width: 0; }

button {
  border: 0;
  cursor: pointer;
  background: #173d67;
  color: white;
  font-weight: bold;
}

button:disabled { opacity: .6; }

#map {
  height: 490px;
  width: 100%;
  border-radius: 10px;
  z-index: 1;
}

#result {
  margin-top: 12px;
  padding: 15px;
  border-radius: 9px;
  font-weight: bold;
  text-align: center;
  display: none;
}

.inside { background: #dcfce7; color: #166534; }
.outside { background: #fee2e2; color: #991b1b; }
.unknown { background: #fef3c7; color: #92400e; }

.admin {
  border: 1px solid #dbe3ed;
}

.admin small {
  display: block;
  color: #64748b;
  line-height: 1.5;
  margin: 8px 0 12px;
}

.admin-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
  align-items: center;
}

.admin-row select { flex: 1; min-width: 150px; }

.green { background: #16834c; }
.red { background: #b83232; }
.gray { background: #64748b; }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 17px;
  margin-top: 12px;
  font-size: 13px;
}

.dot {
  display: inline-block;
  width: 11px;
  height: 11px;
  border-radius: 3px;
  margin-right: 5px;
}

footer {
  text-align: center;
  color: #64748b;
  font-size: 12px;
  padding: 20px;
}

@media(max-width:600px) {
  header h1 { font-size: 20px; }
  #map { height: 420px; }
  .search-row { flex-direction: column; }
  .search-row button { width: 100%; }
}
</style>
</head>

<body>

<header>
  <h1>📍 Cobertura de Delivery</h1>
  <p>Lima Metropolitana y Callao</p>
</header>

<main>

  <section class="panel">
    <h2>Consulta de cobertura para el equipo</h2>

    <div class="search-row">
      <input id="address" type="text"
        placeholder="Ej. Av. Arequipa 1500, Lince">
      <button id="searchBtn" onclick="searchAddress()">
        Buscar dirección
      </button>
    </div>

    <div id="result"></div>
  </section>

  <section class="panel">
    <h2>Mapa de cobertura</h2>

    <div id="map"></div>

    <div class="legend">
      <span><i class="dot" style="background:#16834c"></i>Dentro de cobertura</span>
      <span>Sin color: coordinar disponibilidad contigo</span>
    </div>
  </section>



</main>

<footer>
  Uso interno · Hosanna Store · Lima y Callao
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>
const map = L.map('map').setView([-12.075, -77.055], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

const zones = L.featureGroup().addTo(map);
let marker = null;
let lastSearch = null;

function zoneStyle() {
  return { color: '#16834c', fillColor: '#16834c', fillOpacity: 0.30, weight: 2 };
}

function loadSharedZones(data) {
  zones.clearLayers();
  if (!data || data.type !== 'FeatureCollection') return;
  const geojsonLayer = L.geoJSON(data, { style: zoneStyle });
  // Add each polygon directly to the feature group so the coverage checker
  // can inspect its geometry (rather than seeing only the GeoJSON wrapper).
  geojsonLayer.eachLayer(layer => zones.addLayer(layer));
}

async function fetchSharedZones() {
  try {
    const response = await fetch('./zonas-cobertura.json?v=' + Date.now());
    if (!response.ok) throw new Error('No se pudo cargar la cobertura');
    loadSharedZones(await response.json());
    if (lastSearch) checkLastSearch();
  } catch (error) {
    console.error(error);
    const result = document.getElementById('result');
    result.style.display = 'block';
    result.className = 'unknown';
    result.textContent = 'No se pudo cargar el mapa de cobertura. Avísale al administrador.';
  }
}

function pointInside(point, polygon) {
  const x = point.lng;
  const y = point.lat;
  const rings = polygon.getLatLngs();

  function insideRing(ring) {
    let inside = false;

    for (let i = 0, j = ring.length - 1;
         i < ring.length; j = i++) {
      const xi = ring[i].lng, yi = ring[i].lat;
      const xj = ring[j].lng, yj = ring[j].lat;

      const intersect = ((yi > y) !== (yj > y)) &&
        (x < (xj - xi) * (y - yi) / (yj - yi) + xi);

      if (intersect) inside = !inside;
    }

    return inside;
  }

  function insidePolygon(rings) {
    if (!insideRing(rings[0])) return false;

    for (let i = 1; i < rings.length; i++) {
      if (insideRing(rings[i])) return false;
    }

    return true;
  }

  return insidePolygon(rings);
}

function checkPoint(latlng) {
  let green = false;
  zones.eachLayer(layer => {
    if (layer instanceof L.Polygon && pointInside(latlng, layer)) green = true;
  });
  return green ? 'inside' : 'unknown';
}

function showResult(type, address) {
  const result = document.getElementById('result');
  result.style.display = 'block';

  if (type === 'inside') {
    result.className = 'inside';
    result.innerHTML = '✓ DENTRO DE COBERTURA<br><small>' +
      escapeHTML(address) + '</small>';
  } else {
    result.className = 'unknown';
    result.innerHTML = '⚠ SIN COBERTURA HABITUAL · COORDINAR CONTIGO<br><small>' +
      escapeHTML(address) +
      '</small><br><small>Consulta disponibilidad contigo, especialmente para sábado o domingo. Si no es posible, coordina envío por Shalom.</small>';
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;',
    '"': '&quot;', "'": '&#39;'
  })[c]);
}

function checkLastSearch() {
  if (!lastSearch) return;
  showResult(checkPoint(lastSearch.latlng), lastSearch.address);
}

async function searchAddress() {
  const input = document.getElementById('address');
  const btn = document.getElementById('searchBtn');
  const address = input.value.trim();

  if (!address) {
    alert('Escribe una dirección primero.');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Buscando...';

  try {
    const query = encodeURIComponent(address + ', Lima, Perú');
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + query;

    const response = await fetch(url, {
      headers: { 'Accept-Language': 'es' }
    });

    if (!response.ok) throw new Error('Error de búsqueda');

    const results = await response.json();

    if (!results.length) {
      alert('No encontramos esa dirección. Intenta escribirla con más detalles.');
      return;
    }

    const place = results[0];
    const latlng = L.latLng(
      parseFloat(place.lat),
      parseFloat(place.lon)
    );

    lastSearch = { latlng, address: address };

    map.setView(latlng, 16);

    if (marker) map.removeLayer(marker);

    marker = L.marker(latlng).addTo(map)
      .bindPopup(escapeHTML(address))
      .openPopup();

    showResult(checkPoint(latlng), address);

  } catch (error) {
    alert('No se pudo buscar la dirección. Comprueba tu conexión e inténtalo nuevamente.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Buscar dirección';
  }
}

document.getElementById('address').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchAddress();
});

fetchSharedZones();

</script>

</body>
</html>
